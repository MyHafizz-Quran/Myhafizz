name: Rappels après la prière (secours manuel)
# Le passage automatique est fait par la Neon Function « rappels » (reminders/).
on:
  workflow_dispatch:
concurrency:
  group: prayer-reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            reminders
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Dépendances
        working-directory: reminders
        run: npm ci --no-audit --no-fund >/dev/null
      - name: Envoi
        working-directory: scripts
        env:
          REMINDER_DATABASE_URL: ${{ secrets.REMINDER_DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node prayer-reminders.mjs
