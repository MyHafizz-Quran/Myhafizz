name: Rappels après la prière
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: prayer-reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dépendances
        working-directory: scripts
        run: npm init -y >/dev/null && npm i --no-audit --no-fund web-push@3 adhan@4 pg@8 >/dev/null
      - name: Envoi
        working-directory: scripts
        env:
          REMINDER_DATABASE_URL: ${{ secrets.REMINDER_DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node prayer-reminders.mjs
