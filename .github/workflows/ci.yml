name: Vérifications
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src
      - run: npm run build
  admin:
    name: Admin (build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: myhafizz-admin } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: myhafizz-admin/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
